/* RETRO */.theme-retro{--primary:#1f746e;--dark:#12514d;--soft:#dfe9cf;--accent:#e7882d;--accent2:#f3c265;--paper:#f4e7c4;--card:#fff6dd;--card2:#f4edcf;--text:#342a20;--border:#785d3d;--shadow:rgba(104,74,39,.18);--heading:"Do Hyeon",sans-serif;background-color:#f4e7c4;background-image:radial-gradient(#d8c99f 1.5px,transparent 1.5px);background-size:16px 16px}.theme-retro .bg-top{background:var(--accent);opacity:.75}.theme-retro .bg-bottom{background:var(--primary);opacity:.32}.theme-retro .card{border-radius:6px;border:3px solid var(--border);box-shadow:9px 9px 0 rgba(31,116,110,.18)}.theme-retro .num{border-radius:4px;background:var(--accent);color:#2b221a}.theme-retro .badge{border-radius:0;background:var(--primary);box-shadow:8px 8px 0 var(--accent)}.theme-retro .extra-a{display:block;left:25px;top:50px;width:48px;height:48px;background:var(--accent);border:4px solid var(--border);transform:rotate(12deg)}
/* MINIMAL */.theme-minimal{--primary:#111;--dark:#000;--soft:#eee;--accent:#6b8f71;--accent2:#bdd1c0;--paper:#fff;--card:#fff;--card2:#fff;--text:#181818;--border:#e1e1e1;--shadow:transparent;background:#fff}.theme-minimal .bg-top,.theme-minimal .bg-bottom,.theme-minimal .d1,.theme-minimal .d2,.theme-minimal .d3,.theme-minimal .l1,.theme-minimal .l2,.theme-minimal .badge-line{display:none}.theme-minimal .badge{border-radius:0;background:#111}.theme-minimal .main-title{text-shadow:none}.theme-minimal .header-line{width:70px;height:5px;background:var(--accent)}.theme-minimal .divider{height:1px;background:#ddd}.theme-minimal .divider-dot-a,.theme-minimal .divider-dot-b{display:none}.theme-minimal .card{border:none;border-top:1px solid #e1e1e1;border-radius:0;box-shadow:none;background:#fff}.theme-minimal .num{border-radius:50%;background:#111}.theme-minimal .sec-title{color:#111}
/* MAGAZINE */.theme-magazine{--primary:#111;--dark:#000;--soft:#f1e5e5;--accent:#e23b37;--accent2:#ff918b;--paper:#fff;--card:#fff;--card2:#fafafa;--text:#161616;--border:#d8d8d8;--shadow:rgba(0,0,0,.08);--heading:"Black Han Sans",sans-serif;background:#fff}.theme-magazine .bg-top{border-radius:0;background:var(--accent);clip-path:polygon(22% 0,100% 0,100% 100%,0 73%);opacity:1}.theme-magazine .bg-bottom{display:none}.theme-magazine .badge{background:#111;border-radius:0}.theme-magazine .main-title{color:#111;text-shadow:none}.theme-magazine .header-line{background:var(--accent);height:12px;width:150px}.theme-magazine .divider{height:10px;background:#111}.theme-magazine .divider-dot-a,.theme-magazine .divider-dot-b{display:none}.theme-magazine .card{border-radius:0;border-left:16px solid var(--accent);box-shadow:none}.theme-magazine .num{border-radius:0;background:#111}.theme-magazine .sec-title{color:#111}.theme-magazine .extra-a{display:block;left:58px;top:372px;color:var(--accent);font:900 14px/1 Arial;letter-spacing:4px}.theme-magazine .extra-a::after{content:"LANGUAGE / CULTURE / SCHOOL"}.theme-magazine .extra-b{display:block;right:28px;bottom:22px;font:900 72px/1 Arial;color:#ececec}.theme-magazine .extra-b::after{content:"01"}
/* NOTEBOOK */.theme-notebook{--primary:#25725d;--dark:#17513f;--soft:#e4f3ed;--accent:#f2bd4b;--accent2:#f7de95;--paper:#fffdf8;--card:#fffef9;--card2:#fffef9;--text:#31352f;--border:#b9d3ca;--shadow:rgba(42,100,80,.08);--heading:"Gaegu",cursive;--body:"Gowun Dodum",sans-serif;background-color:#fffdf8;background-image:linear-gradient(rgba(73,135,179,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(73,135,179,.10) 1px,transparent 1px);background-size:28px 28px}.theme-notebook .bg-top,.theme-notebook .bg-bottom{display:none}.theme-notebook .badge{border-radius:18px;background:#25725d;transform:rotate(2deg)}.theme-notebook .main-title{text-shadow:none}.theme-notebook .card{border:2px dashed var(--border);border-radius:22px;box-shadow:none}.theme-notebook .num{border-radius:50%;background:var(--accent);color:#4b3a0f;transform:rotate(-5deg)}.theme-notebook .divider{height:3px;background:#7db8d6}.theme-notebook .extra-a{display:block;left:32px;top:374px;width:110px;height:28px;background:#f7df92;opacity:.72;transform:rotate(-4deg)}.theme-notebook .extra-b{display:block;right:30px;bottom:28px;width:130px;height:7px;background:#e78c70;transform:rotate(-9deg)}.theme-notebook .extra-c{display:block;left:28px;top:70px;width:50px;height:20px;border-top:4px solid #6f98ce;border-bottom:4px solid #6f98ce;transform:rotate(8deg)}
</style>
</head>
<body>
<div id="app">
  <aside id="gallery">
    <div class="header-row">
      <div><h1>바른 언어 디자인 갤러리</h1><p>같은 3:4 레이아웃으로 다양한 디자인을 비교합니다.</p></div>
      <div class="global-actions"><button id="allReason">전체 이유</button><button id="allOrigin">전체 어원</button></div>
    </div>
    <div class="help">TXT에서 맞춰둔 <b>900×1200, 제목·배지·3개 카드의 위치/크기</b>를 기준으로 유지했습니다. 디자인별로 장식·색·테두리·배경·폰트 분위기만 다르게 구성했습니다.</div>
    <div id="themeGrid" class="theme-grid"></div>
  </aside>
  <section id="viewer">
    <div class="viewer-bar">
      <div class="viewer-title"><b id="activeThemeName">기본</b><span id="activeThemeDesc"></span></div>
      <div class="seg"><button id="mainReason" class="on">이유</button><button id="mainOrigin">어원</button></div>
      <div class="viewer-buttons"><button id="prevTheme">← 이전 디자인</button><button id="nextTheme">다음 디자인 →</button></div>
    </div>
    <div id="previewArea"><div class="preview-shell" id="previewShell"><div class="preview-label">900 × 1200 · 3:4</div><div id="mainPosterHost"></div></div></div>
  </section>
</div>
<script>
const CONTENTS={"reason": {"title": "바른 언어를\n사용해야 하는 이유", "items": [{"title": "건강한 인간 관계 유지", "body": "바르지 않은 언어는 서로의 갈등을 만듭니다. 또한 갈등은 서로에게 큰 정신적 피해를 입힙니다."}, {"title": "개인의 인격과 생각 형성", "body": "올바른 언어는 개인의 인격을 만듭니다. 서로를 배려하는 언어는 타인과 긍정적인 관계를 만들어 성숙한 사회적 인격을 만듭니다."}, {"title": "사회적 통합과 문화 보존", "body": "바른 언어를 사용하는 것은 그 언어에 담긴 역사, 가치관 등을 보존하는 행동입니다. 비속어는 우리의 문화를 보존하고 존중하지 않는 행동입니다."}], "sizes": {"title": 80, "section": 45, "body": 27}}, "origin": {"title": "욕의 어원", "items": [{"title": "ㅈㄹ", "body": "원래 발작을 뜻하던 말에서 비롯된 것으로 알려져 있습니다. 이후 의미가 확대되어 심하게 행동하거나 난동을 부리는 모습을 비난하는 말로 쓰이게 되었습니다."}, {"title": "개소리", "body": "이야기 또는 말[言]을 의미하는 '소리'에 '헛된, 가짜의, 쓸데없는'의 뜻을 가지는 접두사 '개-'를 붙여 아무렇게나 지껄이는 조리 없고 당치 않은 말을 비속하게 이르는 말이 되었습니다."}, {"title": "년과 놈", "body": "년과 놈은 처음부터 욕설이 아니었습니다. ‘년'은 여자를 뜻하는 말이였고, ‘놈’은 남자를 가리키는 표현이였습니다. 하지만 시간이 지나며 낮잡아 부르는 의미가 강해졌고, 오늘날에는 상대를 모욕하는 욕설로 사용되고 있습니다."}], "sizes": {"title": 150, "section": 45, "body": 21}}};
const THEMES=[{"id": "basic", "name": "기본", "desc": "초록·금색 원본 분위기. TXT에서 맞춘 비율을 가장 그대로 보여줍니다."}, {"id": "luxury", "name": "화려", "desc": "보석색 그라데이션, 금색 링과 빛 효과를 더한 전시형 디자인."}, {"id": "clean", "name": "깔끔", "desc": "장식을 최소화하고 여백과 얇은 선으로 정리한 단정한 디자인."}, {"id": "modern", "name": "모던", "desc": "네이비·시안, 직선과 기하 도형을 사용한 디지털 프레젠테이션 느낌."}, {"id": "newspaper", "name": "신문", "desc": "아이보리 종이, 명조체, 굵은 규칙선으로 만든 신문 지면 스타일."}, {"id": "classic", "name": "고전", "desc": "버건디·크림·골드와 이중 테두리를 사용한 클래식 문서 스타일."}, {"id": "cozy", "name": "아기자기", "desc": "민트·살구·노랑 파스텔과 작은 스티커 장식을 사용한 부드러운 디자인."}, {"id": "cute", "name": "귀여운", "desc": "하늘·분홍 컬러, 별·하트·구름 장식과 둥근 카드 중심 디자인."}, {"id": "official", "name": "공식적인", "desc": "남색·회색, 엄격한 선과 번호표를 사용한 공문·학교 안내문 느낌."}, {"id": "cool", "name": "간지", "desc": "차콜 블랙·라임, 사선과 네온 포인트를 사용한 강한 포스터 스타일."}, {"id": "retro", "name": "레트로", "desc": "머스터드·오렌지·청록, 도트 패턴과 두꺼운 그림자를 사용한 복고 디자인."}, {"id": "minimal", "name": "미니멀", "desc": "흑백에 한 가지 포인트색만 남긴 극도로 절제된 디자인."}, {"id": "magazine", "name": "매거진", "desc": "강한 타이포와 코너 라벨, 편집 디자인 느낌을 살린 잡지형 레이아웃."}, {"id": "notebook", "name": "노트", "desc": "모눈·테이프·낙서선을 사용한 학습노트/수행평가 자료 느낌."}];
const themeChoice=Object.fromEntries(THEMES.map(t=>[t.id,'reason']));
let activeTheme='basic';
let activeContent='reason';

function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
function posterMarkup(themeId,contentKey){
  const c=CONTENTS[contentKey];
  const origin=contentKey==='origin';
  const titleTop=origin?120:88, titleSize=origin?150:80, bodySize=origin?21:27;
  return `<div class="poster theme-${themeId}">
    <div class="poster-el bg-top"></div><div class="poster-el bg-bottom"></div>
    <div class="poster-el dot d1"></div><div class="poster-el dot d2"></div><div class="poster-el dot d3"></div>
    <div class="poster-el line l1"></div><div class="poster-el line l2"></div>
    <div class="poster-el main-title" style="top:${titleTop}px;font-size:${titleSize}px">${esc(c.title)}</div>
    <div class="poster-el badge"></div><div class="poster-el badge-small">학생과 함께 성장하는\n내포중학교 학생회</div><div class="poster-el badge-big">온율</div><div class="poster-el badge-line"></div>
    <div class="poster-el header-line"></div><div class="poster-el divider"></div><div class="poster-el dot divider-dot-a"></div><div class="poster-el dot divider-dot-b"></div>
    ${c.items.map((it,i)=>`<div class="poster-el card c${i+1}"></div><div class="poster-el num n${i+1}">${i+1}</div><div class="poster-el sec-title t${i+1}">${esc(it.title)}</div><div class="poster-el sec-body b${i+1}" style="font-size:${bodySize}px">${esc(it.body)}</div>`).join('')}
    <div class="extra extra-a"></div><div class="extra extra-b"></div><div class="extra extra-c"></div><div class="extra extra-d"></div><div class="extra extra-e"></div><div class="extra extra-f"></div>
  </div>`;
}

function fitThumb(stage){
  const wrap=stage.parentElement;const s=Math.min(wrap.clientWidth/900,wrap.clientHeight/1200);stage.style.transform=`translateX(-50%) scale(${s})`;
}
function makeThemeCard(theme){
  const card=document.createElement('div');card.className='theme-card'+(theme.id===activeTheme?' active':'');card.dataset.theme=theme.id;
  card.innerHTML=`<div class="thumb-wrap"><div class="thumb-stage">${posterMarkup(theme.id,themeChoice[theme.id])}</div></div><h3>${theme.name}</h3><p>${theme.desc}</p><div class="mini-toggle"><button data-content="reason" class="on">이유</button><button data-content="origin">어원</button></div>`;
  card.addEventListener('click',e=>{if(e.target.closest('.mini-toggle'))return;activeTheme=theme.id;activeContent=themeChoice[theme.id];renderAll(false)});
  card.querySelectorAll('.mini-toggle button').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();themeChoice[theme.id]=b.dataset.content;if(activeTheme===theme.id)activeContent=b.dataset.content;updateCard(card,theme);if(activeTheme===theme.id)renderMain()}));
  return card;
}
function updateCard(card,theme){
  card.classList.toggle('active',theme.id===activeTheme);const stage=card.querySelector('.thumb-stage');stage.innerHTML=posterMarkup(theme.id,themeChoice[theme.id]);card.querySelectorAll('.mini-toggle button').forEach(b=>b.classList.toggle('on',b.dataset.content===themeChoice[theme.id]));requestAnimationFrame(()=>fitThumb(stage));
}
function renderGrid(){
  const grid=document.getElementById('themeGrid');grid.innerHTML='';THEMES.forEach(t=>grid.appendChild(makeThemeCard(t)));requestAnimationFrame(()=>document.querySelectorAll('.thumb-stage').forEach(fitThumb));
}
function renderMain(){
  const theme=THEMES.find(t=>t.id===activeTheme);document.getElementById('activeThemeName').textContent=theme.name;document.getElementById('activeThemeDesc').textContent=theme.desc;document.getElementById('mainPosterHost').innerHTML=posterMarkup(activeTheme,activeContent);document.getElementById('mainReason').classList.toggle('on',activeContent==='reason');document.getElementById('mainOrigin').classList.toggle('on',activeContent==='origin');fitMain();
}
function fitMain(){
  const area=document.getElementById('previewArea'),shell=document.getElementById('previewShell'),poster=shell.querySelector('.poster');if(!poster)return;const s=Math.min((area.clientWidth-80)/900,(area.clientHeight-70)/1200,1);shell.style.width=900*s+'px';shell.style.height=1200*s+'px';poster.style.transform=`scale(${s})`;
}
function renderAll(rebuildGrid=true){if(rebuildGrid)renderGrid();else document.querySelectorAll('.theme-card').forEach(card=>{const t=THEMES.find(x=>x.id===card.dataset.theme);updateCard(card,t)});renderMain()}
function setAllContent(key){THEMES.forEach(t=>themeChoice[t.id]=key);activeContent=key;renderAll(false)}

document.getElementById('allReason').onclick=()=>setAllContent('reason');document.getElementById('allOrigin').onclick=()=>setAllContent('origin');
document.getElementById('mainReason').onclick=()=>{activeContent='reason';themeChoice[activeTheme]='reason';renderAll(false)};document.getElementById('mainOrigin').onclick=()=>{activeContent='origin';themeChoice[activeTheme]='origin';renderAll(false)};
document.getElementById('prevTheme').onclick=()=>{let i=THEMES.findIndex(t=>t.id===activeTheme);i=(i-1+THEMES.length)%THEMES.length;activeTheme=THEMES[i].id;activeContent=themeChoice[activeTheme];renderAll(false)};document.getElementById('nextTheme').onclick=()=>{let i=THEMES.findIndex(t=>t.id===activeTheme);i=(i+1)%THEMES.length;activeTheme=THEMES[i].id;activeContent=themeChoice[activeTheme];renderAll(false)};
window.addEventListener('resize',()=>{document.querySelectorAll('.thumb-stage').forEach(fitThumb);fitMain()});
renderAll(true);
</script>
</body>
</html>
